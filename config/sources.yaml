# Quellen für das SAP-Wiki
# mirrors: offizielle Markdown-Spiegel der SAP-Hilfe auf GitHub (github.com/SAP-docs).
#          Die Änderungshistorie kommt aus den Commits von SAP.
# help_pages: Seiten auf help.sap.com ohne Spiegel (z. B. "What's New").
#          Der Job rendert sie im Headless-Browser und speichert den Text unter snapshots/.
#          Die Historie entsteht durch unsere eigenen Commits.

mirrors:
  - id: datasphere
    product: SAP Datasphere
    repo: https://github.com/SAP-docs/sap-datasphere.git
    path: docs
  - id: hana-cloud-db
    product: SAP HANA Cloud, SAP HANA Database
    repo: https://github.com/SAP-docs/sap-hana-cloud-hana-database.git
    path: docs
    note: "Spiegel seit 28.10.2025 nicht aktualisiert (Stand 03.11.2026) - zusätzlich help_pages nutzen"
  - id: hana-cloud-data-lake
    product: SAP HANA Cloud, Data Lake
    repo: https://github.com/SAP-docs/sap-hana-cloud-data-lake.git
    path: docs
  - id: integration-suite
    product: SAP Integration Suite
    repo: https://github.com/SAP-docs/btp-integration-suite.git
    path: docs
  - id: sap-ai
    product: SAP AI (Generative AI Hub, AI Core)
    repo: https://github.com/SAP-docs/sap-artificial-intelligence.git
    path: docs

# URL im Browser öffnen, aus der Adresszeile kopieren und hier eintragen.
# wait_for: CSS-Selektor, auf den gewartet wird (leer = 8 Sekunden warten).
help_pages:
  - id: bdc-whats-new
    product: SAP Business Data Cloud
    title: What's New
    url: "https://help.sap.com/whats-new/31c53b47cac6482d89f167a1d2a4a50b?locale=en-US"
    wait_for: ""
  - id: sac-whats-new
    product: SAP Analytics Cloud
    title: What's New
    url: "https://help.sap.com/whats-new/42e4f84a0e5e458792b1047eaf81c31a?locale=en-US"
    wait_for: ""
  - id: datasphere-whats-new
    product: SAP Datasphere
    title: What's New
    url: "https://help.sap.com/whats-new/48017b2cc4834fc6b6cae87097bd9e4d?locale=en-US"
    wait_for: ""
  - id: hana-cloud-whats-new
    product: SAP HANA Cloud
    title: What's New
    url: "https://help.sap.com/whats-new/2495b34492334456a49084831c2bea4e?locale=en-US"
    wait_for: ""

# Ganze Guides ohne GitHub-Spiegel, seitenweise über die Schnittstelle der Hilfe.
# url: Link auf IRGENDEINE Seite des Guides (am besten Englisch), Format help.sap.com/docs/<produkt>/<guide>/<seite>.html
# Der Job ruft einen Guide nur neu ab, wenn SAP ihn neu veröffentlicht hat (buildNo).
help_guides:
  - id: bw4hana-data-product-generator
    product: SAP BW/4HANA
    title: Data Product Generator for SAP Business Data Cloud
    url: "https://help.sap.com/docs/SAP_BW4HANA/ed919380760a44388ab90e6bb3e7480a/4efcb40d03334381a6111fd9d270b7f0.html?locale=en-US"
