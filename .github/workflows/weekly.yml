name: SAP-Wiki Wochenlauf

on:
  schedule:
    - cron: "17 4 * * 1"   # montags 04:17 UTC
  workflow_dispatch:        # manuell starten: Actions -> SAP-Wiki Wochenlauf -> Run workflow
    inputs:
      backfill_since:
        description: "Nur beim ersten Lauf: Historie ab Datum (YYYY-MM-DD), sonst leer lassen"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: GitHub-Spiegel der SAP-Hilfe
        run: |
          if [ -n "${{ github.event.inputs.backfill_since }}" ]; then
            python scripts/sync_mirrors.py --backfill-since "${{ github.event.inputs.backfill_since }}"
          else
            python scripts/sync_mirrors.py
          fi
      - name: help.sap.com-Seiten
        run: python scripts/fetch_help_pages.py
      - name: Guides von help.sap.com
        run: python scripts/fetch_help_guides.py
      - name: Notes aus notes/inbox
        run: python scripts/ingest_note_pdfs.py
      - name: Wochenbericht
        run: python scripts/build_weekly_report.py
      - name: Committen
        run: |
          git config user.name "sap-wiki-bot"
          git config user.email "sap-wiki-bot@users.noreply.github.com"
          for e in '.cache/' '__pycache__/'; do grep -qxF "$e" .gitignore 2>/dev/null || echo "$e" >> .gitignore; done
          git rm -r --cached --quiet .cache scripts/__pycache__ 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "Wochenlauf $(date +%G-KW%V)"
          # Falls während des Laufs jemand ins Repo hochgeladen hat: neuen Stand holen und erneut speichern
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 10
          done
          git push   # schlägt sichtbar fehl, falls das Speichern dreimal nicht geklappt hat
